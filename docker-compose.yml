# Amintiri server — Synology DSM 7 (Container Manager → Project → Create → paste this file).
services:
  amintiri:
    image: ghcr.io/costygsm/amintiri-server:latest
    container_name: amintiri
    # host network: the server talks to DSM on 127.0.0.1:5000 to check passwords
    network_mode: host
    # root inside the container only to save uploaded photos as their owner (chown)
    user: root
    environment:
      POZE_HOMES_ROOT: /volume1/homes      # where DSM keeps user home folders
      POZE_PORT: 8090                      # point the DSM reverse proxy here
      POZE_HOST: 0.0.0.0                   # fast backup at home: phones on the same Wi-Fi upload straight to the NAS
                                           # (only private addresses are answered; use 127.0.0.1 to turn it off)
      POZE_DSM_URL: http://127.0.0.1:5000  # DSM's own HTTP port, local only
      TZ: Europe/Bucharest                 # for photos whose EXIF has no time zone
    volumes:
      - /volume1/homes:/volume1/homes
      - /etc/passwd:/etc/passwd:ro         # to map DSM user names to file owners
      - /etc/group:/etc/group:ro           # administrators see when a new version is out
      - ./data:/data                       # create this folder first; database, thumbnails, daily backups
    restart: unless-stopped
    mem_limit: 2g
